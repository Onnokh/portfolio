# The card is one static page. Vite puts a content hash in every asset's name, so assets are cached
# for a year; the page itself is checked again on every visit, so a deploy shows at once.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
